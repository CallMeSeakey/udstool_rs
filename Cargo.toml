[package]
name = "udstool_rs"
version = "0.9.0"
edition = "2021"
authors = ["Hugo <yinpuhui@csshuobo.com>"]

[profile.release]
opt-level = "z"     # 优化代码体积（或用 "s"）
lto = true          # 启用全局链接时优化（跨 crate 剔除无用死代码）
codegen-units = 1   # 降低并行度以获得最大的体积优化
panic = "abort"     # 移除庞大的栈回溯展开表 (Unwind tables)
strip = true        # 彻底剥离符号信息与调试字符

[dependencies]
eframe = { version = "0.27", features = ["default"] }
egui = "0.27"
egui_extras = { version = "0.27", features = ["all_loaders"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
crc32fast = "1.3"
md-5 = "0.10"
chrono = "0.4"
libloading = "0.8"
flate2 = "1.0"
rfd = "0.14"
lazy_static = "1.4"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
rusb = "0.9"

[build-dependencies]
winres = "0.1"